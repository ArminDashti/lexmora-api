name: lexmora

services:
  lexmora-pgsql:
    image: postgres:16
    container_name: lexmora-pgsql
    environment:
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: translator
      POSTGRES_DB: translator
    volumes:
      - lexmora-pgsql-vol:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - t3-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator -d translator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lexmora-api:
    # Image is built by run-on-docker-*.ps1 (Dockerfile in this folder, context = repo root).
    image: ${API_IMAGE_TAG:-lexmora-api:latest}
    container_name: lexmora-api
    expose:
      - "8080"
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change-me-docker-dev-only}
      DATABASE_URL: postgres://translator:translator@lexmora-pgsql:5432/translator?sslmode=disable
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-armin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-Lexmora@2024}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://lexmora.xaigrok.ir}
    volumes:
      - lexmora-api-vol:/data
    networks:
      - t3-net
    depends_on:
      lexmora-pgsql:
        condition: service_healthy
    restart: unless-stopped

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true

volumes:
  lexmora-pgsql-vol:
    name: lexmora-pgsql-vol
  lexmora-api-vol:
    name: lexmora-api-vol
