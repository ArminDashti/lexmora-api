# Local Docker deploy settings for translator-api (lexmora).
# Edit this file to change behavior; the script takes no CLI flags.

stack_name: lexmora
image_tag: lexmora-api:latest
compose_file: docker-compose.yml
docker_network: t3-net
api_publish_port: "8080"
delete_volume: "no"
delete_image: "no"
jwt_secret: change-me-docker-dev-only
cors_origins: "http://localhost:5173,http://127.0.0.1:5173,https://lexmora.xaigrok.ir"
default_username: armin
default_password: Translator@2024
