# Remote deploy settings — scripts read this file only (no CLI -- flags).
# Non-empty override fields replace values from compose_file / dockerfile.
# Behind HAProxy: lexmora-api.xaigrok.ir → lexmora-api:8080 on t3-net (no host publish).
# Sibling docker-compose.openrouter-proxy.yml joins openvpn-net when present.

stack_name: lexmora
image_tag: lexmora-api:latest
compose_file: ../../docker-compose.yml
dockerfile: ../../dockerfile
docker_network: t3-net
internal_port: "8080"
publish_port: ""
delete_volume: "no"
delete_image: "yes"
build_image_on: "local"

ssh: "ssh t3 -p 80"

volume_dir: "/cloud-admin/docker/lexmora"
