# Remote deploy settings — scripts read this file only (no CLI -- flags).
# Non-empty override fields replace values from compose_file / dockerfile.
# Behind HAProxy (lexmora-api.xaigrok.ir → lexmora-api:8080 on t3-net).

stack_name: lexmora
image_tag: lexmora-api:latest
compose_file: ../../.deploy/docker/docker-compose.yml
dockerfile: ../../.deploy/docker/Dockerfile
docker_network: t3-net
internal_port: ""
publish_port: ""
delete_volume: "no"
delete_image: "yes"
# local = build here and upload; server = build on remote
build_image_on: "local"

ssh: "ssh t3"

volume_dir: "/cloud-admin/docker/lexmora"
