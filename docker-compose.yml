name: lexmora

services:
  lexmora-pgsql:
    image: postgres:16
    container_name: lexmora-pgsql
    environment:
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: translator
      POSTGRES_DB: translator
    volumes:
      - lexmora-pgsql-vol:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - t3-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator -d translator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lexmora-api:
    # Image is built by .armin/docker-scripts/run-on-docker-*.ps1 (context = repo root).
    # Host publish is optional via docker-compose.publish.yml when publish_port is set.
    # On t3, HAProxy reaches this container as lexmora-api:8080 on t3-net (no host bind).
    # Server overlay docker-compose.openrouter-proxy.yml adds Mullvad HTTP proxy egress.
    image: ${IMAGE_TAG:-lexmora-api:latest}
    container_name: lexmora-api
    expose:
      - "8080"
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change-me-docker-dev-only}
      DATABASE_URL: postgres://translator:translator@lexmora-pgsql:5432/translator?sslmode=disable
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-armin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-IUpe8SqXxtJrEJxZ}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8090,http://127.0.0.1:8090,https://lexmora.xaigrok.ir}
      OPENROUTER_HTTP_PROXY: ${OPENROUTER_HTTP_PROXY:-}
    volumes:
      - lexmora-api-vol:/data
    networks:
      - t3-net
    depends_on:
      lexmora-pgsql:
        condition: service_healthy
    restart: unless-stopped

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true

volumes:
  lexmora-pgsql-vol:
    name: lexmora-pgsql-vol
  lexmora-api-vol:
    name: lexmora-api-vol
