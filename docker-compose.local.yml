# Local Docker hot-reload: Postgres + Go Air API + Vite WebUI (bind mounts).
# Usage: docker compose -f docker-compose.local.yml -p lexmora-local up -d --force-recreate
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexmora
      POSTGRES_PASSWORD: lexmora
      POSTGRES_DB: lexmora
    ports:
      - "5437:5432"
    volumes:
      - lexmora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexmora -d lexmora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: golang:1.23-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://lexmora:lexmora@postgres:5432/lexmora?sslmode=disable
      JWT_SECRET: change-me-lexmora-jwt
      CORS_ORIGINS: http://localhost:5180,http://127.0.0.1:5180,http://localhost:5173,http://127.0.0.1:5173
      DEFAULT_USERNAME: armin
      DEFAULT_PASSWORD: dopadopa123
      GIN_MODE: debug
      GOTOOLCHAIN: auto
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - lexmora-gomod:/go/pkg/mod
      - lexmora-gotmp:/app/tmp
    ports:
      - "8178:8080"
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: "/lexmora/"
      VITE_HMR_CLIENT_PORT: "80"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY_TARGET: http://api:8080
    command:
      - sh
      - -c
      - rm -rf /app/node_modules/* /app/node_modules/.[!.]* 2>/dev/null; npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../lexmora-webui:/app
      - lexmora-webui-node-modules:/app/node_modules
    ports:
      - "5180:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

volumes:
  lexmora-postgres-data:
  lexmora-gomod:
  lexmora-gotmp:
  lexmora-webui-node-modules:

networks:
  pc-armin-local:
    external: true
